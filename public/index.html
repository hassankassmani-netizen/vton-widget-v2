<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Virtual try-on</title>
<style>
:root{--ink:#1c1b19;--mut:#76716a;--paper:#fbfaf7;--line:#e5e1d8;--soft:#f1eee7;--ac:#0f766e;--on:#fff}
*{box-sizing:border-box;margin:0;padding:0}
     #app{height:100%}
   body.top{margin:20px}
   body.top #app{height:auto}
   body.top #fab{width:180px;height:60px}
   body.top #panel{width:400px;height:640px}          
html,body{height:100%;background:transparent;font:14px/1.4 "Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#fab{width:100%;height:100%;border-radius:30px;background:var(--ink);color:#fff;font-weight:600;letter-spacing:.01em;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#panel{height:100%;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.28)}
@media(max-width:520px){#panel{border-radius:0}}
.hd{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.hd h1{font-size:15px;font-weight:700}
.x{width:30px;height:30px;border-radius:15px;font-size:18px;color:var(--mut)}
.x:hover{background:var(--soft)}
.steps{display:flex;gap:6px;padding:10px 14px 0}
.steps button{flex:1;padding:7px 0;border-bottom:2px solid var(--line);font-size:12px;color:var(--mut);font-weight:600}
.steps button.on{border-color:var(--ac);color:var(--ink)}
.bd{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.lb{font-size:12px;font-weight:700;margin-bottom:6px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px}
.seg button{flex:1;padding:7px;border-radius:8px;font-weight:600;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:6px 11px;border:1px solid var(--line);border-radius:18px;font-weight:600;background:#fff}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.photo{display:flex;gap:10px;align-items:center;padding:10px;border:1px dashed var(--line);border-radius:12px;background:#fff}
.photo img{width:54px;height:72px;object-fit:cover;border-radius:8px;background:var(--soft)}
.photo p{color:var(--mut);font-size:12px}
.link{color:var(--ac);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;text-align:left}
.card.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--soft)}
.card div{padding:7px 9px}
.card b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{font-size:12px;color:var(--mut)}
.cta{width:100%;padding:12px;border-radius:12px;background:var(--ac);color:var(--on);font-weight:700}
.cta[disabled]{opacity:.45;cursor:not-allowed}
.ghost{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);font-weight:700;background:#fff}
.note{font-size:12px;color:var(--mut)}
.err{padding:10px 12px;border-radius:10px;background:#fdeceb;color:#8a2a22;font-size:13px}
.stage{position:relative;aspect-ratio:3/4;max-height:340px;margin:0 auto;border-radius:12px;overflow:hidden;background:var(--soft);display:flex;align-items:center;justify-content:center}
.stage img{width:100%;height:100%;object-fit:contain;transition:filter .25s}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--ac);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:3s}.stage img{transition:none}}
input[type=text]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
</style>
</head>
<body>
<div id="app"></div>
<script>
const q = new URLSearchParams(location.search);
     if (parent === window) document.body.classList.add("top");          
if (/^#[0-9a-f]{6}$/i.test(q.get("accent") || "")) document.documentElement.style.setProperty("--ac", q.get("accent"));

const MODELS = { female: "models/female.jpg", male: "models/male.jpg" };
const HEIGHTS = ["5'0\"","5'2\"","5'4\"","5'6\"","5'8\"","5'10\"","6'0\"","6'2\""];
const SIZES = ["XS","S","M","L","XL","XXL"];
const LIGHTS = { studio: "none", day: "brightness(1.08) contrast(1.04) saturate(1.05)", evening: "brightness(.85) contrast(1.1) sepia(.25) saturate(1.1)" };

const S = { open:false, step:1, gender:"female", photo:null, height:"5'6\"", size:"M",
            products:[], cat:null, item:null, manualUrl:"", result:null, loading:false, light:"studio", err:"" };

const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const post = m => parent !== window && parent.postMessage(m, "*");

function resize(src, max = 768) {
  return new Promise((ok, no) => {
    const i = new Image(); i.crossOrigin = "anonymous";
    i.onload = () => {
      const k = Math.min(1, max / Math.max(i.width, i.height));
      const c = document.createElement("canvas");
      c.width = Math.round(i.width * k); c.height = Math.round(i.height * k);
      c.getContext("2d").drawImage(i, 0, 0, c.width, c.height);
      ok(c.toDataURL("image/jpeg", .88));
    };
    i.onerror = () => no(new Error("Could not load the photo. Add it to /models or upload your own."));
    i.src = src;
  });
}

const visible = () => S.products.filter(p => !p.gender || p.gender === "unisex" || p.gender === S.gender);
const cats = () => [...new Set(visible().map(p => p.category || "other"))];
const LABEL = { upper:"Tops", bottom:"Bottoms", footwear:"Footwear", accessories:"Accessories", other:"Other" };

function setOpen(o) { S.open = o; post({ type:"VTON_RESIZE", open:o }); render(); }

async function tryOn() {
  const garment = S.item?.img || S.manualUrl;
  if (!garment) return;
  S.step = 3; S.loading = true; S.err = ""; S.result = null; render();
  try {
    const person = S.photo || await resize(MODELS[S.gender]);
    const r = await fetch("/api/tryon", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ person, garment, name: S.item?.name || "garment" }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Try-on failed");
    S.result = j.url;
  } catch (e) { S.err = e.message; }
  S.loading = false; render();
}

function viewStep1() {
  return `
  <div><div class="lb">Model</div>
    <div class="seg" role="group" aria-label="Gender">
      <button data-a="g" data-v="female" class="${S.gender==="female"?"on":""}">Female</button>
      <button data-a="g" data-v="male" class="${S.gender==="male"?"on":""}">Male</button>
    </div></div>
  <div class="photo">
    <img src="${S.photo || MODELS[S.gender]}" alt="" onerror="this.style.visibility='hidden'">
    <div><b>${S.photo ? "Your photo" : "Studio model"}</b>
      <p>${S.photo ? "Garments are fitted on you." : "Or upload a full-body photo, front-facing, plain background."}</p>
      <label class="link" style="cursor:pointer">${S.photo ? "Change photo" : "Upload your photo"}
        <input type="file" accept="image/*" data-a="file" hidden></label>
      ${S.photo ? `<button class="link" data-a="rmphoto" style="margin-left:10px">Remove</button>` : ""}
    </div></div>
  <div><div class="lb">Your height</div><div class="chips">
    ${HEIGHTS.map(h => `<button data-a="h" data-v="${esc(h)}" class="${S.height===h?"on":""}">${esc(h)}</button>`).join("")}
  </div></div>
  <div><div class="lb">Your size</div><div class="chips">
    ${SIZES.map(z => `<button data-a="z" data-v="${z}" class="${S.size===z?"on":""}">${z}</button>`).join("")}
  </div></div>
  <button class="cta" data-a="next2">Choose an outfit</button>`;
}

function viewStep2() {
  const list = visible();
  if (!S.products.length) {
    return `<p class="note">This store's products haven't loaded yet. For testing, paste a clothing image URL:</p>
      <input type="text" id="manual" placeholder="https://…/shirt.jpg" value="${esc(S.manualUrl)}">
      <button class="cta" data-a="try" ${S.manualUrl ? "" : "disabled"}>Try it on</button>`;
  }
  const c = S.cat && cats().includes(S.cat) ? S.cat : cats()[0];
  return `
  <div class="chips">${cats().map(k => `<button data-a="cat" data-v="${k}" class="${k===c?"on":""}">${LABEL[k] || esc(k)}</button>`).join("")}</div>
  <div class="grid">${list.filter(p => (p.category || "other") === c).map(p => `
    <button class="card ${S.item?.id===p.id?"on":""}" data-a="item" data-v="${esc(p.id)}">
      <img src="${esc(p.img)}" alt="" loading="lazy"><div><b>${esc(p.name)}</b><span>${esc(p.price)}</span></div></button>`).join("")}</div>
  <p class="note">Tops give the most accurate result right now.</p>
  <button class="cta" data-a="try" ${S.item ? "" : "disabled"}>Try it on</button>`;
}

function viewStep3() {
  if (S.loading) return `<div class="stage"><div class="spin" aria-label="Loading"></div></div>
    <p class="note" style="text-align:center">Creating your look. This can take up to a minute.</p>`;
  if (S.err) return `<div class="err">${esc(S.err)}</div>
    <button class="cta" data-a="try">Try again</button><button class="ghost" data-a="back2">Pick another outfit</button>`;
  if (!S.result) return `<p class="note">Choose an outfit first.</p><button class="cta" data-a="back2">Choose an outfit</button>`;
  return `
  <div class="stage"><img src="${esc(S.result)}" alt="Try-on result" style="filter:${LIGHTS[S.light]}"></div>
  <div class="seg" role="group" aria-label="Lighting">
    ${["studio","day","evening"].map(k => `<button data-a="light" data-v="${k}" class="${S.light===k?"on":""}">${k[0].toUpperCase()+k.slice(1)}</button>`).join("")}
  </div>
  <div><b>${esc(S.item?.name || "Your outfit")}</b><div class="note">${esc(S.item?.price || "")} · Size ${S.size} · ${esc(S.height)}</div></div>
  ${S.item?.url ? `<button class="cta" data-a="open">View product</button>` : ""}
  <a class="ghost" style="text-align:center;text-decoration:none;color:inherit" href="${esc(S.result)}" target="_blank" rel="noopener">Open full image</a>
  <button class="ghost" data-a="back2">Try another outfit</button>`;
}

function render() {
  if (!S.open) { $app.innerHTML = `<button id="fab" data-a="open-panel">✨ Virtual try-on</button>`; return; }
  const tabs = [["1","You"],["2","Outfit"],["3","Result"]];
  $app.style.height = "100%";
  $app.innerHTML = `<section id="panel" aria-label="Virtual try-on">
    <div class="hd"><h1>Virtual try-on</h1><button class="x" data-a="close" aria-label="Close">×</button></div>
    <div class="steps">${tabs.map(([n,t]) => `<button data-a="step" data-v="${n}" class="${S.step==n?"on":""}">${t}</button>`).join("")}</div>
    <div class="bd">${S.step===1 ? viewStep1() : S.step===2 ? viewStep2() : viewStep3()}</div></section>`;
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a, v = b.dataset.v;
  if (a === "open-panel") return setOpen(true);
  if (a === "close") return setOpen(false);
  if (a === "g") { S.gender = v; S.item = null; S.cat = null; }
  else if (a === "h") S.height = v;
  else if (a === "z") S.size = v;
  else if (a === "rmphoto") S.photo = null;
  else if (a === "next2" || a === "back2") S.step = 2;
  else if (a === "step") S.step = +v;
  else if (a === "cat") S.cat = v;
  else if (a === "item") S.item = S.products.find(p => String(p.id) === v);
  else if (a === "light") S.light = v;
  else if (a === "open") return post({ type:"VTON_OPEN_PRODUCT", url:S.item.url });
  else if (a === "try") return tryOn();
  render();
});
document.addEventListener("change", async e => {
  if (e.target.dataset.a !== "file" || !e.target.files[0]) return;
  const url = URL.createObjectURL(e.target.files[0]);
  try { S.photo = await resize(url); } catch (err) { S.err = err.message; }
  URL.revokeObjectURL(url); render();
});
document.addEventListener("input", e => {
  if (e.target.id !== "manual") return;
  S.manualUrl = e.target.value.trim();
  document.querySelector('[data-a="try"]').disabled = !S.manualUrl;
});
window.addEventListener("message", e => {
  const d = e.data || {};
  if (d.type === "VTON_CATALOG" && Array.isArray(d.products)) {
    S.products = d.products.filter(p => p && p.img); S.item = null; S.cat = null; render();
  }
});

render();
post({ type:"VTON_READY" });
</script>
</body>
</html>
